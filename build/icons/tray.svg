<?xml version="1.0" encoding="UTF-8"?>
<!--
拾语托盘图标（权威源，22×22 网格）。
从 app-icon.svg 的「声纹成字」构图派生：去掉石墨底板与白描边，
只保留左边三根声纹竖条和右边两条文字横线，读起来仍是「说话变成文字」。

托盘图标是静态单色，录音不换图：macOS 本身有麦克风使用中指示，
其他菜单栏应用也不改图标颜色。这里的中灰 #8E8E93 供 Windows 静态
idle.png；macOS 由 generate:brand 从同一几何换黑稿渲染 template.png，
以系统模板图（SetTemplateIcon）加载，菜单栏深浅与失焦/高亮都由系统
自动着色，与邻近图标完全一致。图标只设一次，模板标志粘性无副作用。

几何约束：所有元素宽度/高度 ≥ 2px（这里取 2.6），圆角 rx=1.3，
最高竖条与两条横线共用上下基线（y=4 / y=18），与 app-icon 的构图一致。
渲染产物为 44×44 PNG，落在 desktop/assets/tray/，命令见
build/Taskfile.yml 的 generate:brand；几何改动后必须重新渲染。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22" role="img" aria-label="拾语">
  <!-- 声纹：三根竖条，高度 8 / 14 / 10，节奏打散才像人声 -->
  <g fill="#8E8E93">
    <rect x="2.5" y="7" width="2.6" height="8" rx="1.3" />
    <rect x="6.5" y="4" width="2.6" height="14" rx="1.3" />
    <rect x="10.5" y="6" width="2.6" height="10" rx="1.3" />
    <!-- 文字：两条横线，第二行更短，上下基线与最高竖条对齐 -->
    <rect x="15" y="4" width="4.5" height="2.6" rx="1.3" />
    <rect x="15" y="15.4" width="3.2" height="2.6" rx="1.3" />
  </g>
</svg>