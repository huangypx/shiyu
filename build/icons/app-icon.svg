<?xml version="1.0" encoding="UTF-8"?>
<!--
拾语应用图标（权威源，1024×1024）。
几何改动后必须重新渲染位图，命令见 build/Taskfile.yml 的 generate:brand。

构图「声纹成字」：左边三根竖条是声纹，右边两条横线是整理后的文字，
最高的那根竖条与两条横线共用上下基线，读起来就是「说话变成文字」。
小尺寸（14–18px）在应用内另有精简版，见 frontend/src/components/BrandMark.tsx，
两边都改才算改完品牌标记。

砖：外边距 100、圆角 184，照 macOS 图标网格（内容 824²）落位；
填充 #202020 就是 Radix 的 gray-12（浅色档），与主界面的石墨色实心按钮同色，
因此图标和界面共用一套「石墨 + 靛蓝」语言。
砖边缘另画一条内缩的白描边：深色桌面与深色任务栏上，
纯 #202020 的边界几乎看不见，需要一点亮边把形状托出来。

标记：柱宽=线高=80，柱间距 52，声纹组与文字组间距 80，
上下轨正好落在最高柱的上下边缘（y=302 / y=722），整套落在一个 608×420 的矩形里，
砖内左右留 108、上下留 202。
颜色对比度（WCAG，对 #202020 实算）：#FFFFFF 16.3:1、#5472E4 3.8:1，
都高于非文本图形 3:1 的下限；靛蓝取 Radix indigo-10 的深色档，
换成界面强调色 indigo-9 就只有 3.1:1，在石墨底上会发闷。

已知取舍：16px 帧（Windows ico）元素会糊，只有砖的剪影与声纹节奏可辨；
32px 起五个元素各自清楚。不为此再画一套小尺寸艺术稿——两套稿才是不一致的根源。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="拾语">
  <defs>
    <clipPath id="shiyu-tile">
      <rect x="100" y="100" width="824" height="824" rx="184" />
    </clipPath>
  </defs>

  <!-- 砖与内描边：描边有一半落在砖外，靠 clipPath 裁掉，避免砖外多出一圈亮边 -->
  <g clip-path="url(#shiyu-tile)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="#202020" />
    <rect
      x="100"
      y="100"
      width="824"
      height="824"
      rx="184"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.1"
      stroke-width="20"
    />
  </g>

  <!-- 声纹：三根竖条 |
       高度 292 / 420 / 336，不是等差的：等差会看成柱状图，节奏打散才像人声 -->
  <g fill="#FFFFFF">
    <rect x="208" y="366" width="80" height="292" rx="40" />
    <rect x="340" y="302" width="80" height="420" rx="40" />
    <rect x="472" y="344" width="80" height="336" rx="40" />
  </g>

  <!-- 文字：两条横线，第二行更短，读起来像一段收尾的句子 -->
  <g fill="#5472E4">
    <rect x="632" y="302" width="184" height="80" rx="40" />
    <rect x="632" y="642" width="132" height="80" rx="40" />
  </g>
</svg>
